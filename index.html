<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>buddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Hallmark · genre: atmospheric · macrostructure: Workbench · theme: Terminal · tone: technical · anchor hue: 150 (phosphor) · enrichment: none · nav: N8 · footer: Ft2 */
/* Hallmark · pre-emit critique: P4 H4 E4 S5 R5 V4 */
:root{
  --color-paper:oklch(13% 0.010 150);
  --color-paper-2:oklch(16% 0.012 150);
  --color-paper-3:oklch(19% 0.012 150);
  --color-rule:oklch(28% 0.012 150);
  --color-neutral:oklch(58% 0.012 150);
  --color-ink:oklch(93% 0.010 150);
  --color-accent:oklch(82% 0.19 150);
  --color-accent-ink:oklch(18% 0.04 150);
  --color-focus:oklch(82% 0.19 150);
  --color-warn:oklch(82% 0.16 80);
  --color-bad:oklch(70% 0.18 25);
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --space-3xs:.25rem;--space-2xs:.5rem;--space-xs:.75rem;--space-sm:1rem;--space-md:1.5rem;--space-lg:2rem;--space-xl:3rem;
  --text-xs:.75rem;--text-sm:.875rem;--text-md:1rem;--text-lg:1.25rem;--text-xl:1.75rem;
  --ease-out:cubic-bezier(.16,1,.3,1);--ease-in:cubic-bezier(.7,0,.84,0);
  --dur-micro:120ms;--dur-short:220ms;
  --rule-hair:1px;--gutter:clamp(1rem,4vw,2rem);
}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{margin:0;background:var(--color-paper);color:var(--color-ink);font:400 var(--text-md)/1.55 var(--font-mono);font-variant-numeric:tabular-nums;min-height:100dvh;display:flex;flex-direction:column}
a{color:var(--color-ink)}
:focus-visible{outline:2px solid var(--color-focus);outline-offset:2px}
/* nav — N8 */
.nav{padding:var(--space-sm) var(--gutter);border-bottom:var(--rule-hair) solid var(--color-rule);font-size:var(--text-sm);overflow-x:auto;white-space:nowrap}
.nav pre{margin:0;font:inherit}
.nav .p{color:var(--color-accent);padding-right:.4ch}
.nav a{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--color-rule)}
.nav a:hover{text-decoration-color:var(--color-accent)}
.caret{display:inline-block;width:1ch;color:var(--color-accent);animation:blink 1.05s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
/* layout */
main{flex:1;width:100%;max-width:68rem;margin:0 auto;padding:var(--space-lg) var(--gutter) var(--space-xl)}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--space-2xs) var(--space-md);margin:0 0 var(--space-lg)}
h1{margin:0;font-size:var(--text-xl);font-weight:600;letter-spacing:-.02em;overflow-wrap:anywhere;min-width:0}
.state{color:var(--color-neutral);font-size:var(--text-sm)}
.state b{font-weight:600;color:var(--color-accent)}
.state.off b{color:var(--color-bad)}
.state.unk b{color:var(--color-warn)}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr));gap:var(--space-md)}
section{border:var(--rule-hair) solid var(--color-rule);background:var(--color-paper-2);padding:var(--space-sm) var(--space-md) var(--space-md);scroll-margin-top:var(--space-md)}
section.wide{grid-column:1/-1}
h2{margin:0 0 var(--space-sm);font-size:var(--text-sm);font-weight:600;color:var(--color-neutral)}
h2::before{content:"[ ";color:var(--color-rule)}h2::after{content:" ]";color:var(--color-rule)}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:var(--space-3xs) var(--space-md);margin:0}
.kv dt{color:var(--color-neutral)}
.kv dd{margin:0;overflow-wrap:anywhere}
.kv dd.up{color:var(--color-accent);font-weight:600}.kv dd.down{color:var(--color-bad);font-weight:600}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:.9em;margin-left:var(--space-2xs);vertical-align:-1px}
.bars i{width:3px;background:var(--color-rule)}
.bars i:nth-child(1){height:30%}.bars i:nth-child(2){height:55%}.bars i:nth-child(3){height:78%}.bars i:nth-child(4){height:100%}
.bars i.on{background:var(--color-accent)}
/* inputs */
textarea,input[type=number]{width:100%;background:var(--color-paper);color:var(--color-ink);border:var(--rule-hair) solid var(--color-rule);padding:var(--space-xs) var(--space-sm);font:inherit;border-radius:0}
textarea{resize:vertical;min-height:5.5rem;display:block}
textarea:focus,input:focus{border-color:var(--color-accent);outline:none}
.row{display:flex;flex-wrap:wrap;gap:var(--space-xs);align-items:center;margin-top:var(--space-sm)}
.meta{margin-left:auto;color:var(--color-neutral);font-size:var(--text-sm)}
/* buttons — 8 states */
button{font:inherit;font-weight:600;font-size:var(--text-sm);padding:var(--space-xs) var(--space-sm);border:var(--rule-hair) solid var(--color-rule);background:var(--color-paper-3);color:var(--color-ink);cursor:pointer;border-radius:0;white-space:nowrap;transition:transform var(--dur-micro) var(--ease-out),border-color var(--dur-micro) var(--ease-out)}
button::before{content:"> ";color:var(--color-neutral)}
button.pri{border-color:var(--color-accent);color:var(--color-accent)}
button.pri::before{color:var(--color-accent)}
button.danger{border-color:var(--color-bad);color:var(--color-bad)}
button.danger::before{color:var(--color-bad)}
button:hover{border-color:var(--color-ink)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:default;transform:none}
button[data-state=loading]{color:var(--color-neutral);border-color:var(--color-rule);cursor:progress}
button[data-state=loading]::before{content:"… "}
button[data-state=success]{border-color:var(--color-accent);color:var(--color-accent)}
button[data-state=success]::before{content:"✓ ";color:var(--color-accent)}
button[data-state=error]{border-color:var(--color-bad);color:var(--color-bad)}
button[data-state=error]::before{content:"! ";color:var(--color-bad)}
/* LED */
.sw{display:flex;flex-wrap:wrap;gap:var(--space-2xs);margin-top:var(--space-sm)}
.sw button{padding:0;width:2.25rem;height:2.25rem;border-color:var(--color-rule)}
.sw button::before{content:none}
.sw button i{display:block;width:100%;height:100%;background:var(--c)}
.sw button.off{width:auto;padding:0 var(--space-sm)}
.sw button[aria-pressed=true]{border-color:var(--color-ink);outline:2px solid var(--color-ink);outline-offset:-3px}
input[type=color]{width:2.25rem;height:2.25rem;padding:0;border:var(--rule-hair) solid var(--color-rule);background:none;border-radius:0}
input[type=range]{flex:1;min-width:8rem;accent-color:var(--color-accent)}
/* footer — Ft2 */
footer{border-top:var(--rule-hair) solid var(--color-rule);padding:var(--space-sm) var(--gutter);color:var(--color-neutral);font-size:var(--text-xs)}
footer p{margin:0;overflow-wrap:anywhere}
/* toast */
.toast{position:fixed;left:50%;bottom:var(--space-md);transform:translate(-50%,8px);opacity:0;background:var(--color-paper-3);border:var(--rule-hair) solid var(--color-rule);padding:var(--space-2xs) var(--space-sm);font-size:var(--text-sm);pointer-events:none;transition:opacity var(--dur-short) var(--ease-out),transform var(--dur-short) var(--ease-out);max-width:calc(100% - 2*var(--gutter))}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.caret{animation:none}*{transition-duration:0s!important}}
</style>

<header class="nav"><pre><span class="p">&gt;</span>buddy <a href="#wifi">--wifi</a> <a href="#message">--message</a> <a href="#led">--led</a> <a href="#system">--system</a> <a href="#connections">--mqtt</a><span class="caret" aria-hidden="true">▮</span></pre></header>

<main>
<div class="head">
  <h1>buddy</h1>
</div>

<div class="panels">
<section id="wifi">
  <h2>wifi</h2>
  <dl class="kv">
    <dt>ssid</dt><dd id="ssid">—</dd>
    <dt>ip</dt><dd id="ip">—</dd>
    <dt>rssi</dt><dd><span id="rssi">—</span><span class="bars" id="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span></dd>
    <dt>ping</dt><dd id="ping">—</dd>
  </dl>
</section>

<section id="system">
  <h2>system</h2>
  <dl class="kv">
    <dt>uptime</dt><dd id="up">—</dd>
    <dt>led</dt><dd id="lednow">off</dd>
    <dt>history</dt><dd id="hist">—</dd>
  </dl>
  <div class="row"><button id="push">push history</button><button class="danger" id="reboot">reboot</button></div>
</section>

<section id="connections">
  <h2>connections</h2>
  <dl class="kv">
    <dt>link</dt><dd id="linkst">—</dd>
    <dt>relay</dt><dd id="relayst">—</dd>
    <dt>mac</dt><dd id="macst">—</dd>
    <dt>topics</dt><dd id="topics">—</dd>
  </dl>
</section>

<section id="message" class="wide">
  <h2>message</h2>
  <label for="text" class="state" style="display:block;margin-bottom:var(--space-2xs)">drawn on the tft under the wifi lines · 5 rows</label>
  <textarea id="text" maxlength="200" spellcheck="false"></textarea>
  <div class="row">
    <button class="pri" id="show">show</button>
    <button id="clear">clear</button>
    <span class="meta"><span id="count">0</span>/200</span>
  </div>
</section>

<section id="led" class="wide">
  <h2>led</h2>
  <div class="row" style="margin-top:0">
    <input type="color" id="color" value="#00ff66" aria-label="colour">
    <input type="range" id="bri" min="0" max="100" value="5" aria-label="brightness">
    <span class="meta"><span id="briv">5</span>%</span>
  </div>
  <div class="sw" role="group" aria-label="presets">
    <button style="--c:#ff0000" data-c="#ff0000" aria-label="red"><i></i></button>
    <button style="--c:#ff8000" data-c="#ff8000" aria-label="orange"><i></i></button>
    <button style="--c:#ffff00" data-c="#ffff00" aria-label="yellow"><i></i></button>
    <button style="--c:#00ff00" data-c="#00ff00" aria-label="green"><i></i></button>
    <button style="--c:#0000ff" data-c="#0000ff" aria-label="blue"><i></i></button>
    <button style="--c:#ffffff" data-c="#ffffff" aria-label="white"><i></i></button>
    <button class="off" data-c="off">off</button>
  </div>
  <div class="row"><button class="pri" id="setled">set</button></div>
</section>
</div>
</main>

<footer><p id="foot">buddy · micropython · esp32-s3 · st7789 240×240</p></footer>
<div class="toast" id="toast" role="status"></div>

<script>
const $=id=>document.getElementById(id);
let toastT;
function toast(m){$('toast').textContent=m;$('toast').classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>$('toast').classList.remove('show'),1800)}
async function post(path,data){
  const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(data)});
  const t=await r.text(); if(!r.ok) throw new Error(t); return t;
}
// button state machine: loading → success|error → default
async function run(btn,fn){
  if(btn.dataset.state==='loading')return;
  btn.dataset.state='loading';
  try{const r=await fn();btn.dataset.state='success';return r}
  catch(e){btn.dataset.state='error';toast('failed: '+e.message);throw e}
  finally{setTimeout(()=>btn.removeAttribute('data-state'),900)}
}
function fmtUp(s){const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return (d?d+'d ':'')+(h?h+'h ':'')+m+'m '+(s%60)+'s'}
function render(s){
  const l=s.link;
  $('ssid').textContent=l?l.ssid:'disconnected';$('ip').textContent=l?l.ip:'—';
  $('rssi').textContent=l&&l.rssi!=null?l.rssi+' dBm':'—';
  const n=l&&l.rssi!=null?(l.rssi>=-55?4:l.rssi>=-65?3:l.rssi>=-75?2:1):0;
  [...$('bars').children].forEach((b,i)=>b.classList.toggle('on',i<n));
  const p=s.ping;
  $('ping').textContent=p?(p.avg_ms==null?'-- · '+p.loss_pct+'% loss':p.avg_ms+' ms · '+p.loss_pct+'% loss · ±'+p.jitter_ms+' ms'):'—';
  $('up').textContent=fmtUp(s.uptime_s);
  $('lednow').textContent=s.led||'off';
  const conn=(id,up)=>{const d=$(id);d.textContent=up?'up':'down';d.className=up?'up':'down'};
  conn('linkst',!!l);conn('relayst',!!s.relay);conn('macst',!!s.mac);
  $('hist').textContent=(s.history||0)+' batches on-device';
  $('topics').textContent=(s.topics&&s.topics.length)?s.topics.join(' · '):'—';
  document.querySelectorAll('.sw button').forEach(b=>b.setAttribute('aria-pressed',String((s.led||'off')===b.dataset.c)));
  $('foot').textContent='buddy · '+(l?l.ip:'no link')+' · up '+fmtUp(s.uptime_s)+' · micropython / esp32-s3';
}
async function refresh(){try{render(await (await fetch('/status')).json())}catch(e){for(const id of['linkst','relayst']){const d=$(id);d.textContent='unreachable';d.className='down'}}}
refresh();setInterval(refresh,5000);
$('text').oninput=()=>$('count').textContent=$('text').value.length;
$('show').onclick=()=>run($('show'),()=>post('/message',{text:$('text').value}));
$('clear').onclick=()=>{$('text').value='';$('count').textContent=0;run($('clear'),()=>post('/message',{text:''}))};
$('bri').oninput=()=>$('briv').textContent=$('bri').value;
async function led(btn,c){const r=await run(btn,()=>post('/led',{color:c,brightness:$('bri').value}));$('lednow').textContent=r;refresh()}
$('setled').onclick=()=>led($('setled'),$('color').value);
document.querySelectorAll('.sw button').forEach(b=>b.onclick=()=>{if(b.dataset.c!=='off')$('color').value=b.dataset.c;led(b,b.dataset.c)});
$('push').onclick=async()=>{const r=await run($('push'),()=>post('/history/push',{}));toast(r);setTimeout(refresh,1500)};
let armed=false;
$('reboot').onclick=async()=>{
  if(!armed){armed=true;$('reboot').textContent='again to confirm';setTimeout(()=>{armed=false;$('reboot').textContent='reboot'},3000);return}
  armed=false;$('reboot').disabled=true;$('reboot').textContent='rebooting';
  try{await post('/reboot',{})}catch(e){}
  setTimeout(()=>{$('reboot').disabled=false;$('reboot').textContent='reboot';refresh()},8000);
};
</script>
</html>
