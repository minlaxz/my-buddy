<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buddy</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#262a33;--fg:#e6e8ee;--mute:#8a91a0;--acc:#4cc9f0;--ok:#3ddc84;--bad:#ff5c5c;--warn:#ffcf5c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
h1{margin:0;font-size:22px;letter-spacing:.04em}
.pill{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--line);color:var(--mute)}
.pill.on{background:#123b2a;color:var(--ok)}.pill.off{background:#3b1212;color:var(--bad)}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h2{margin:0 0 12px;font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--mute);text-transform:uppercase}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-variant-numeric:tabular-nums}
.kv b{color:var(--mute);font-weight:500}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:14px;margin-left:8px;vertical-align:-2px}
.bars i{width:4px;background:var(--line);border-radius:1px}
.bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:7px}.bars i:nth-child(3){height:10px}.bars i:nth-child(4){height:14px}
.bars i.on{background:var(--ok)}
textarea,input[type=number]{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}
textarea{resize:vertical;min-height:84px}
.row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.row .grow{flex:1}
button{font:inherit;font-weight:600;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:#222734;color:var(--fg);cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#061018}
button.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.5;cursor:default}
.hint{font-size:12px;color:var(--mute);margin-left:auto}
input[type=color]{width:48px;height:40px;padding:0;border:1px solid var(--line);border-radius:10px;background:none}
input[type=range]{flex:1;accent-color:var(--acc)}
.swatches{display:flex;gap:8px;margin-top:10px}
.swatches button{width:36px;height:36px;padding:0;border-radius:50%;border:2px solid var(--line)}
.swatches button.off{font-size:11px;width:auto;border-radius:10px;padding:0 12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;transition:.2s;background:#222734;border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:14px;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
<main>
<header><h1>BUDDY</h1><span id="pill" class="pill">connecting…</span></header>

<section>
<h2>Wi-Fi Link</h2>
<div class="kv">
<b>SSID</b><span id="ssid">—</span>
<b>IP</b><span id="ip">—</span>
<b>RSSI</b><span><span id="rssi">—</span><span class="bars" id="bars"><i></i><i></i><i></i><i></i></span></span>
</div>
</section>

<section>
<h2>Message</h2>
<textarea id="text" maxlength="200" placeholder="Shown on the TFT, below the Wi-Fi lines"></textarea>
<div class="row">
<button class="pri" id="show">Show</button>
<button id="clear">Clear</button>
<span class="hint"><span id="count">0</span>/200</span>
</div>
</section>

<section>
<h2>LED</h2>
<div class="row">
<input type="color" id="color" value="#4cc9f0">
<input type="range" id="bri" min="0" max="100" value="5">
<span class="hint"><span id="briv">5</span>%</span>
</div>
<div class="swatches">
<button data-c="#ff0000" style="background:#ff0000"></button>
<button data-c="#ff8000" style="background:#ff8000"></button>
<button data-c="#ffff00" style="background:#ffff00"></button>
<button data-c="#00ff00" style="background:#00ff00"></button>
<button data-c="#0000ff" style="background:#0000ff"></button>
<button data-c="#ffffff" style="background:#ffffff"></button>
<button class="off" data-c="off">Off</button>
</div>
<div class="row"><button class="pri" id="setled">Set LED</button><span class="hint">now: <span id="lednow">off</span></span></div>
</section>

<section>
<h2>System</h2>
<div class="kv"><b>Uptime</b><span id="up">—</span></div>
<div class="row"><button class="danger" id="reboot">Reboot</button></div>
</section>
</main>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
let toastT;
function toast(m){$('toast').textContent=m;$('toast').classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>$('toast').classList.remove('show'),1800)}
async function post(path,data){
  const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(data)});
  const t=await r.text(); if(!r.ok) throw new Error(t); return t;
}
function fmtUp(s){const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return (d?d+'d ':'')+(h?h+'h ':'')+m+'m '+(s%60)+'s'}
function render(s){
  const l=s.link;
  $('pill').textContent=l?'connected':'disconnected';$('pill').className='pill '+(l?'on':'off');
  $('ssid').textContent=l?l.ssid:'Disconnected';$('ip').textContent=l?l.ip:'—';
  $('rssi').textContent=l&&l.rssi!=null?l.rssi+' dBm':'—';
  const n=l&&l.rssi!=null?(l.rssi>=-55?4:l.rssi>=-65?3:l.rssi>=-75?2:1):0;
  [...$('bars').children].forEach((b,i)=>b.classList.toggle('on',i<n));
  $('up').textContent=fmtUp(s.uptime_s);
  $('lednow').textContent=s.led||'off';
}
async function refresh(){try{render(await (await fetch('/status')).json())}catch(e){$('pill').textContent='unreachable';$('pill').className='pill off'}}
refresh();setInterval(refresh,5000);
$('text').oninput=()=>$('count').textContent=$('text').value.length;
$('show').onclick=async()=>{try{toast(await post('/message',{text:$('text').value}))}catch(e){toast('Failed: '+e.message)}};
$('clear').onclick=async()=>{$('text').value='';$('count').textContent=0;try{toast(await post('/message',{text:''}))}catch(e){toast('Failed')}};
$('bri').oninput=()=>$('briv').textContent=$('bri').value;
async function led(c){try{const r=await post('/led',{color:c,brightness:$('bri').value});$('lednow').textContent=r;toast('LED '+r)}catch(e){toast('Failed')}}
$('setled').onclick=()=>led($('color').value);
document.querySelectorAll('.swatches button').forEach(b=>b.onclick=()=>{if(b.dataset.c!=='off')$('color').value=b.dataset.c;led(b.dataset.c)});
let armed=false;
$('reboot').onclick=async()=>{
  if(!armed){armed=true;$('reboot').textContent='Tap again to reboot';setTimeout(()=>{armed=false;$('reboot').textContent='Reboot'},3000);return}
  armed=false;$('reboot').disabled=true;$('reboot').textContent='Rebooting…';
  try{await post('/reboot',{})}catch(e){}
  setTimeout(()=>{$('reboot').disabled=false;$('reboot').textContent='Reboot';refresh()},8000);
};
</script>
</html>
