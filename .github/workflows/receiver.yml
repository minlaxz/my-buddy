name: receiver image

on:
  push:
    branches: [main]
    paths: [receiver/**, lib/isrg-root-x1.pem, .github/workflows/receiver.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 receiver/history_server.py --check
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: receiver/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/buddy-receiver:latest
            ghcr.io/${{ github.repository_owner }}/buddy-receiver:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
